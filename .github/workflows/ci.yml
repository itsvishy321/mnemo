name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        # validate-wrappers defaults to true: this alone verifies the committed
        # gradle-wrapper.jar / gradlew scripts match the checksum in
        # gradle/wrapper/gradle-wrapper.properties before anything else runs.

      - name: Build
        run: ./gradlew build --stacktrace
        # `build` depends on `check`, which is where mnemo.pure-java-conventions wires in
        # checkNoCompileClasspathContraband / checkNoRuntimeClasspathContraband, and where the
        # ArchUnit test in mnemo-core runs alongside the rest of the test suite.
