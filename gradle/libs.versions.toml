[versions]
java = "21"

springBoot = "4.1.1"
netty = "4.2.17.Final"
junit = "5.14.4"
assertj = "3.27.7"
archunit = "1.5.0"
awaitility = "4.3.0"

[libraries]
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport" }
netty-buffer = { module = "io.netty:netty-buffer" }
netty-handler = { module = "io.netty:netty-handler" }
netty-codec = { module = "io.netty:netty-codec" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

springBoot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
springBoot-starterWeb = { module = "org.springframework.boot:spring-boot-starter-web" }
springBoot-starterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
springBoot-starterTest = { module = "org.springframework.boot:spring-boot-starter-test" }

[bundles]
netty = ["netty-transport", "netty-buffer", "netty-handler", "netty-codec"]
testing = ["junit-jupiter", "assertj-core", "awaitility"]

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
